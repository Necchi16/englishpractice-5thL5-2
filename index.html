<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D English Preposition Quest!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Nipple.js for virtual joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0fdfa; font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Custom Animations & Styles */
        .btn-game { transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 6px 0 var(--btn-shadow); }
        .btn-game:active { transform: translateY(4px); box-shadow: 0 2px 3px rgba(0,0,0,0.1), 0 2px 0 var(--btn-shadow); }
        .btn-blue { background-color: #3b82f6; color: white; --btn-shadow: #2563eb; }
        .btn-green { background-color: #22c55e; color: white; --btn-shadow: #16a34a; }
        .btn-yellow { background-color: #eab308; color: white; --btn-shadow: #ca8a04; }
        .btn-red { background-color: #ef4444; color: white; --btn-shadow: #dc2626; }
        .btn-purple { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; --btn-shadow: #9333ea; }
        
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        .gacha-spin { animation: spin 0.5s ease-in-out infinite; }
        @keyframes spin { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        
        .mic-recording { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Hide scrollbar for character collection */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Joystick area */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 20;
            pointer-events: auto;
            /* Hide on desktop by default, handle in JS */
        }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
        }

        /* Instructions overlay */
        #controls-hint {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">

                    </div>

                <!-- MCQ Area (Hidden by default) -->

                </div>

    </div>

    <!-- Gacha Modal -->

    </div>

    <!-- Collection Modal -->

        <div class="bg-white rounded-3xl p-6 max-w-4xl w-full h-[85vh] mx-4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black text-blue-600">キャラクター図鑑 (<span id="collection-count">0</span>/50)</h2>

            </div>
            <div id="collection-grid" class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 p-2">

            </div>

    </div>

        // Rarity styling mapping
        const RARITY_COLORS = {
            "Common": "bg-gray-100 text-gray-700 border-gray-300",
            "Rare": "bg-blue-100 text-blue-700 border-blue-300",
            "Epic": "bg-purple-100 text-purple-700 border-purple-300",

        };

        // Word Dictionary (for display & logic)
        const DICT = {
            places: {
                desk: { en: "desk", ja: "机" },
                chair: { en: "chair", ja: "いす" },
                bed: { en: "bed", ja: "ベッド" },
                basket: { en: "basket", ja: "かご" },
                wall: { en: "wall", ja: "壁(かべ)" },
                sofa: { en: "sofa", ja: "ソファ" },

            },
            items: {

            },

        // Allowed combinations logic per room type
        const ROOM_TYPES = [
            {
                name: "Bedroom",
                color: "#dbeafe", // blue-100
                items: ["apple", "bag", "clock", "book", "ball", "cup"],
                rules: [
                    { place: "desk", preps: ["on", "under", "by"] },
                    { place: "chair", preps: ["on", "under", "by"] },
                    { place: "bed", preps: ["on", "under", "by"] },

                ]
            },
            {
                name: "Living Room",
                color: "#ffedd5", // orange-100
                items: ["apple", "bag", "clock", "book", "ball", "cup"],
                rules: [
                    { place: "sofa", preps: ["on", "under", "by"] },

                ]
            },

                color: "#dcfce7", // green-100
                items: ["apple", "bag", "book", "ball"],
                rules: [
                    { place: "bench", preps: ["on", "under", "by"] },
                    { place: "tree", preps: ["under", "by"] },
                    { place: "basket", preps: ["in", "by"] }
                ]
            }
        ];

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'gacha') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        class Scene3D {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color('#dbeafe'); 
                this.scene.fog = new THREE.Fog('#dbeafe', 10, 30);
                
                // Camera setup for first person view
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 3, 5); // Start position
                
                // View control state
                this.yaw = 0;
                this.pitch = 0;

                // Renderer setup
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambientLight);

                this.dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                this.dirLight.position.set(5, 10, 5);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.mapSize.width = 1024;
                this.dirLight.shadow.mapSize.height = 1024;
                this.dirLight.shadow.camera.near = 0.5;
                this.dirLight.shadow.camera.far = 25;
                this.scene.add(this.dirLight);

                // Common Materials
                this.mats = {
                    wood: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
                    lightWood: new THREE.MeshLambertMaterial({ color: 0xdeb887 }),
                    fabricBlue: new THREE.MeshLambertMaterial({ color: 0x93c5fd }),
                    fabricRed: new THREE.MeshLambertMaterial({ color: 0xfca5a5 }),
                    basket: new THREE.MeshLambertMaterial({ color: 0xcd853f }),
                    wall: new THREE.MeshLambertMaterial({ color: 0xfdf6e3 }),
                    floorWood: new THREE.MeshLambertMaterial({ color: 0xd2b48c }),
                    grass: new THREE.MeshLambertMaterial({ color: 0x86efac }),
                    leaves: new THREE.MeshLambertMaterial({ color: 0x4ade80 }),
                    trunk: new THREE.MeshLambertMaterial({ color: 0x78350f })
                };

                // Group for the environment to easily swap rooms
                this.envGroup = new THREE.Group();
                this.scene.add(this.envGroup);

                // Group for the target item
                this.targetGroup = new THREE.Group();
                this.scene.add(this.targetGroup);
                
                this.currentItemMesh = null;
                this.anchors = {};
                this.currentRoomType = null;

                // Movement controls
                this.moveState = { forward: false, backward: false, left: false, right: false };
                this.velocity = new THREE.Vector3();
                this.direction = new THREE.Vector3();
                this.speed = 8.0; // Movement speed
                this.prevTime = performance.now();
                
                // Joystick Data
                this.joystickVector = { x: 0, y: 0 };

                this.setupControls();
                this.setupJoystick();

                // Handle resize
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // Animate loop bound to this instance
                this.animate = this.animate.bind(this);
                // We don't call this.animate() here directly anymore. App will call it when ready.
                
                // Hide hint after a few seconds
                setTimeout(() => {
                    const hint = document.getElementById('controls-hint');
                    if(hint) hint.style.opacity = '0';
                }, 4000);
            }
            
            setupControls() {
                // Keyboard
                document.addEventListener('keydown', (event) => {
                    switch (event.code) {
                        case 'ArrowUp':
                        case 'KeyW': this.moveState.forward = true; break;
                        case 'ArrowLeft':
                        case 'KeyA': this.moveState.left = true; break;
                        case 'ArrowDown':
                        case 'KeyS': this.moveState.backward = true; break;
                        case 'ArrowRight':
                        case 'KeyD': this.moveState.right = true; break;
                    }
                });

                document.addEventListener('keyup', (event) => {
                    switch (event.code) {
                        case 'ArrowUp':
                        case 'KeyW': this.moveState.forward = false; break;
                        case 'ArrowLeft':
                        case 'KeyA': this.moveState.left = false; break;
                        case 'ArrowDown':
                        case 'KeyS': this.moveState.backward = false; break;
                        case 'ArrowRight':
                        case 'KeyD': this.moveState.right = false; break;
                    }
                });
                
                // Mouse / Touch Look
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };
                
                const onPointerDown = (e) => {
                    // Don't trigger look if interacting with UI or joystick
                    if (e.target.closest('#ui-layer') || e.target.closest('#joystick-zone')) return;
                    isDragging = true;
                    previousMousePosition = { x: e.clientX || e.touches?.[0].clientX, y: e.clientY || e.touches?.[0].clientY };
                };
                
                const onPointerMove = (e) => {
                    if (!isDragging) return;
                    
                    const clientX = e.clientX || (e.touches && e.touches.length > 0 ? e.touches[0].clientX : previousMousePosition.x);
                    const clientY = e.clientY || (e.touches && e.touches.length > 0 ? e.touches[0].clientY : previousMousePosition.y);
                    
                    const deltaMove = {
                        x: clientX - previousMousePosition.x,
                        y: clientY - previousMousePosition.y
                    };
                    
                    const sensitivity = 0.005;
                    this.yaw -= deltaMove.x * sensitivity;
                    this.pitch -= deltaMove.y * sensitivity;
                    
                    // Clamp pitch
                    this.pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, this.pitch));
                    
                    this.updateCameraRotation();
                    
                    previousMousePosition = { x: clientX, y: clientY };
                };
                
                const onPointerUp = () => { isDragging = false; };
                
                document.addEventListener('mousedown', onPointerDown);
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('mouseup', onPointerUp);
                
                document.addEventListener('touchstart', onPointerDown, {passive: false});
                document.addEventListener('touchmove', onPointerMove, {passive: false});
                document.addEventListener('touchend', onPointerUp);
            }
            
            setupJoystick() {
                // Only show joystick on touch devices
                if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                    const zone = document.getElementById('joystick-zone');
                    const manager = nipplejs.create({
                        zone: zone,
                        mode: 'static',
                        position: { left: '50%', top: '50%' },
                        color: 'white',
                        size: 100
                    });
                    
                    manager.on('move', (evt, data) => {
                        const forward = Math.sin(data.angle.radian);
                        const right = Math.cos(data.angle.radian);
                        // Map joystick vector (distance up to 50) to -1 to 1 range
                        const force = Math.min(data.distance / 50, 1.0);
                        this.joystickVector.x = right * force;
                        this.joystickVector.y = forward * force; // y is forward/backward in 2d joy
                    });
                    
                    manager.on('end', () => {
                        this.joystickVector = { x: 0, y: 0 };
                    });
                } else {
                    document.getElementById('joystick-zone').style.display = 'none';
                }
            }

            updateCameraRotation() {
                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.x = this.pitch;
                euler.y = this.yaw;
                this.camera.quaternion.setFromEuler(euler);
            }

                switch(itemName) {
                    case 'apple':
                        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshLambertMaterial({color: 0xff0000}));

                        break;
                    case 'bag':
                        mesh = new THREE.Group();
                        const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.5), new THREE.MeshLambertMaterial({color: 0x16a34a}));
                        body.position.y = 0.4;
                        const handle = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 8, 16, Math.PI), new THREE.MeshLambertMaterial({color: 0x16a34a}));
                        handle.position.y = 0.8;
                        mesh.add(body); mesh.add(handle);
                        break;
                    case 'clock':
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32), new THREE.MeshLambertMaterial({color: 0xfacc15}));
                        mesh.rotation.x = Math.PI/2;
                        mesh.position.y = 0.5;
                        break;
                    case 'ball':
                        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshLambertMaterial({color: 0xf97316})); // orange
                        mesh.position.y = 0.4;
                        break;
                    case 'cup':
                        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.5, 16), new THREE.MeshLambertMaterial({color: 0xe5e7eb})); // gray
                        mesh.position.y = 0.25;
                        break;
                }
                
                const box = new THREE.Box3().setFromObject(mesh);
                mesh.userData.height = box.max.y - box.min.y;
                
                // Add a gentle floating animation wrapper
                const floatGroup = new THREE.Group();
                floatGroup.add(mesh);
                
                mesh.castShadow = true;
                this.currentItemMesh = floatGroup;
                this.targetGroup.add(floatGroup);
            }

            placeItem(itemName, prep, placeName) {
                this.createItem(itemName);
                const anchor = this.anchors[placeName];
                
                // If anchor doesn't exist in this room, something went wrong, but fallback
                if(!anchor) {
                    console.warn(`Anchor ${placeName} not found in this room.`);
                    return;
                }
                
                const h = this.currentItemMesh.children[0].userData.height;

                let x = anchor.center.x;
                let y = anchor.center.y;
                let z = anchor.center.z;

                if (prep === 'on') {
                    y = anchor.size.h; // Place on top
                    if(placeName === 'wall') {
                        y = anchor.center.y;
                        z = anchor.center.z + 0.1; // slightly off wall
                    }
                } else if (prep === 'under') {
                    y = 0; // Floor level
                } else if (prep === 'by') {
                    y = 0; // Floor level
                    // Place it somewhere around the object
                    x = anchor.center.x + (anchor.size.w/2 + 0.8) * (Math.random()>0.5?1:-1); 
                    z = anchor.center.z + (Math.random()-0.5);
                } else if (prep === 'in') {
                    y = 0.2; // inside basket bottom
                }

                this.targetGroup.position.set(x, y, z);
                
                // Reset rotation
                this.targetGroup.rotation.set(0,0,0);
                
                // Special rotation for wall items
                if(placeName === 'wall' && (itemName === 'clock' || itemName === 'book')) {
                    this.targetGroup.rotation.y = 0; 
                }
                
                // Little pop animation
                this.targetGroup.scale.set(0.1, 0.1, 0.1);
                let t = 0;
                const popAnim = () => {
                    t += 0.1;
                    if(t <= 1) {
                        const s = 1 + Math.sin(t * Math.PI) * 0.2;
                        this.targetGroup.scale.set(s, s, s);
                        requestAnimationFrame(popAnim);
                    } else {
                        this.targetGroup.scale.set(1, 1, 1);
                    }
                };
                popAnim();
                
                // Reset camera to reasonable position to see the room
                this.camera.position.set(0, 3, 6);
                this.yaw = 0;
                this.pitch = -0.2;
                this.updateCameraRotation();
            }
            
            animate() {
                requestAnimationFrame(this.animate);
                
                const time = performance.now();
                const delta = ( time - this.prevTime ) / 1000;
                
                // Handle Movement
                this.velocity.x -= this.velocity.x * 10.0 * delta;
                this.velocity.z -= this.velocity.z * 10.0 * delta;

                // Keyboard input
                this.direction.z = Number( this.moveState.forward ) - Number( this.moveState.backward );
                this.direction.x = Number( this.moveState.right ) - Number( this.moveState.left );
                this.direction.normalize(); 
                
                // Combine with Joystick input
                let moveX = this.direction.x;
                let moveZ = this.direction.z;
                
                if (this.joystickVector.x !== 0 || this.joystickVector.y !== 0) {
                    moveX += this.joystickVector.x;
                    moveZ += this.joystickVector.y;
                }

                if ( this.moveState.forward || this.moveState.backward || this.joystickVector.y !== 0) this.velocity.z -= moveZ * 40.0 * delta;
                if ( this.moveState.left || this.moveState.right || this.joystickVector.x !== 0) this.velocity.x -= moveX * 40.0 * delta;

                // Apply velocity to camera position taking rotation into account
                const camRot = this.camera.rotation.y;
                
                this.camera.position.x += (this.velocity.x * Math.cos(camRot) + this.velocity.z * Math.sin(camRot)) * delta;
                this.camera.position.z += (this.velocity.z * Math.cos(camRot) - this.velocity.x * Math.sin(camRot)) * delta;
                
                // Basic boundaries
                this.camera.position.x = Math.max(-9.5, Math.min(9.5, this.camera.position.x));
                this.camera.position.z = Math.max(-9.5, Math.min(9.5, this.camera.position.z));
                // Keep height constant
                this.camera.position.y = 3;

                this.prevTime = time;
                
                // Gentle floating and spinning for the target item
                if (this.targetGroup && this.currentItemMesh) {
                    this.currentItemMesh.position.y = Math.sin(time * 0.003) * 0.2;
                    this.currentItemMesh.rotation.y += 0.01;
                }
                
                this.renderer.render(this.scene, this.camera);
            }
        }

        class App {
            constructor() {
                this.scene3d = new Scene3D();
                
                // State
                this.coins = parseInt(localStorage.getItem('eq_coins')) || 0;
                this.collection = JSON.parse(localStorage.getItem('eq_collection')) || [];
                this.round = 1;
                this.fails = 0;
                this.currentQuestion = null; // { mode: 'ask'|'answer', item, prep, place, targetSentence }
                this.isListening = false;
                
                // Speech setup
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'en-US';
                    this.recognition.interimResults = false;
                    this.recognition.maxAlternatives = 1;
                    
                    this.recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        this.handleSpeechResult(transcript);
                    };
                    
                    this.recognition.onstart = () => {
                        this.isListening = true;
                        document.getElementById('btn-mic').classList.add('mic-recording');
                        document.getElementById('transcript-text').innerText = "きいているよ...";
                        document.getElementById('transcript-text').classList.add('text-red-500');
                    };
                    
                    this.recognition.onend = () => {
                        this.isListening = false;
                        document.getElementById('btn-mic').classList.remove('mic-recording');
                        if (document.getElementById('transcript-text').innerText === "きいているよ...") {
                             document.getElementById('transcript-text').innerText = "マイクボタンを押してね";
                             document.getElementById('transcript-text').classList.remove('text-red-500');
                        }
                    };
                    
                    this.recognition.onerror = (event) => {
                        console.error("Speech error", event);
                        this.isListening = false;
                        document.getElementById('btn-mic').classList.remove('mic-recording');
                        document.getElementById('transcript-text').innerText = "エラー: もう一度押してね";
                        
                        // Fallback logic if mic fails due to permissions etc.
                        if (event.error === 'not-allowed' || event.error === 'no-speech') {
                             this.fails++;
                             this.updateFails();
                             if(this.fails >= 1) {
                                 // Fast track to MCQ if mic is denied
                                 this.fails = 3;
                                 this.updateFails();
                             }
                        }
                    };
                } else {
                    console.warn("Speech Recognition API is not supported in this browser.");
                    // Don't alert immediately, let the user try and gracefully fail to MCQ
                }

                this.updateUI();
                
                // Ensure the game logic starts after setup
                setTimeout(() => {
                    this.generateRound();
                    this.scene3d.animate();
                }, 500); // Small delay to ensure rendering context is ready
            }

            generateRound() {
                this.fails = 0;
                document.getElementById('fail-counter').classList.add('hidden');
                document.querySelectorAll('.fail-dot').forEach(el => el.classList.replace('bg-red-500', 'bg-gray-300'));
                
                document.getElementById('voice-area').classList.remove('hidden');
                document.getElementById('mcq-area').classList.add('hidden');
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('transcript-text').innerText = "マイクボタンを押して英語を話してね";
                document.getElementById('transcript-text').classList.remove('text-red-500', 'text-green-600');
                
                document.getElementById('round-indicator').innerText = `Round ${this.round}`;

                // Pick random room
                const roomConf = ROOM_TYPES[Math.floor(Math.random() * ROOM_TYPES.length)];
                this.scene3d.buildRoom(roomConf);
                document.getElementById('room-name').innerText = roomConf.name;

                // Pick random valid combination for THIS room
                const item = roomConf.items[Math.floor(Math.random() * roomConf.items.length)];
                
                const rule = roomConf.rules[Math.floor(Math.random() * roomConf.rules.length)];
                const place = rule.place;
                const prep = rule.preps[Math.floor(Math.random() * rule.preps.length)];

                // Determine mode: 0 = answer (Where is it?), 1 = ask (Ask where it is)
                const mode = Math.random() > 0.5 ? 'answer' : 'ask';
                
                this.currentQuestion = { item, prep, place, mode, roomConf };
                
                // Generate Target Sentence
                let targetEn, instructionJa, hintText;
                
                const itemName = DICT.items[item].en;
                const placeName = DICT.places[place].en;
                
                if (mode === 'answer') {
                    // Answer Pattern: "It's on the desk."
                    targetEn = `It's ${prep} the ${placeName}.`;
                    instructionJa = `「${DICT.items[item].ja}」はどこにある？`;
                    hintText = "ヒント: It's ...";
                } else {
                    // Ask Pattern: "Where is the apple?"
                    targetEn = `Where is the ${itemName}?`;
                    instructionJa = `「${DICT.items[item].ja}」の場所を英語で聞こう！`;
                    hintText = "ヒント: Where ...";
                }
                
                this.currentQuestion.targetSentence = targetEn;
                
                // Update UI
                document.getElementById('instruction-text').innerText = instructionJa;
                document.getElementById('target-hint').innerText = hintText;

                // Update 3D
                this.scene3d.placeItem(item, prep, place);
                
                console.log("Target:", targetEn); // Debug
            }

            toggleListening() {
                if(!this.recognition) return;
                if(this.isListening) {
                    this.recognition.stop();
                } else {
                    this.recognition.start();
                }
            }

            handleSpeechResult(transcript) {
                document.getElementById('transcript-text').innerText = `「${transcript}」`;
                
                const isCorrect = this.checkAnswer(transcript, this.currentQuestion.targetSentence);
                
                if (isCorrect) {
                    document.getElementById('transcript-text').classList.add('text-green-600');
                    document.getElementById('transcript-text').classList.remove('text-red-500');
                    this.handleSuccess();
                } else {
                    document.getElementById('transcript-text').classList.add('text-red-500');
                    this.handleFail();
                }
            }

            checkAnswer(spoken, target) {
                // Normalize strings: lowercase, remove punctuation
                const normalize = (str) => {
                    return str.toLowerCase().replace(/[.,!?]/g, '').trim();
                };
                
                const s = normalize(spoken);
                const t = normalize(target);
                
                if (s === t) return true;
                
                // Handle common contractions and variations for kids
                const sExpanded = s.replace("where's", "where is").replace("it's", "it is");
                const tExpanded = t.replace("where's", "where is").replace("it's", "it is");
                
                if (sExpanded === tExpanded) return true;
                
                // Sometimes speech recog misses "the". Be slightly lenient for kids.
                const removeArticles = (str) => str.replace(/\b(the|a|an)\b/g, '').trim().replace(/\s+/g, ' ');
                if(removeArticles(sExpanded) === removeArticles(tExpanded)) return true;

                return false;
            }

            handleSuccess() {
                playSound('correct');
                this.showFeedback("Excellent!");
                this.addCoin();
                
                document.getElementById('voice-area').classList.add('hidden');
                document.getElementById('mcq-area').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
            }

            handleFail() {
                playSound('wrong');
                this.fails++;
                this.updateFails();
                
                if (this.fails >= 3) {
                    this.switchToMCQ();
                } else {
                    this.showFeedback("Try again!", true);
                }
            }

            updateFails() {
                const counter = document.getElementById('fail-counter');
                counter.classList.remove('hidden');
                const dots = counter.querySelectorAll('.fail-dot');
                for(let i=0; i<3; i++) {
                    if(i < this.fails) {
                        dots[i].classList.replace('bg-gray-300', 'bg-red-500');
                    }
                }
            }

            switchToMCQ() {
                document.getElementById('voice-area').classList.add('hidden');
                const mcqArea = document.getElementById('mcq-area');
                mcqArea.classList.remove('hidden');
                mcqArea.innerHTML = '';
                
                document.getElementById('instruction-text').innerText = "正しい英語をえらぼう！";
                document.getElementById('target-hint').innerText = "";

                // Generate options
                const correctAns = this.currentQuestion.targetSentence;
                let options = [correctAns];
                
                const currentRules = this.currentQuestion.roomConf.rules;
                
                while(options.length < 4) {
                    let wrongOpt = "";
                    if(this.currentQuestion.mode === 'answer') {
                        // Mix preps and places from current room
                        const rRule = currentRules[Math.floor(Math.random() * currentRules.length)];
                        const rPlace = rRule.place;
                        const rPrep = rRule.preps[Math.floor(Math.random() * rRule.preps.length)];
                        wrongOpt = `It's ${rPrep} the ${DICT.places[rPlace].en}.`;
                    } else {
                        // Mix items from current room
                        const itemsList = this.currentQuestion.roomConf.items;
                        const rItem = itemsList[Math.floor(Math.random() * itemsList.length)];
                        wrongOpt = `Where is the ${DICT.items[rItem].en}?`;
                    }
                    
                    if(!options.includes(wrongOpt)) {
                        options.push(wrongOpt);
                    }
                }
                
                // Shuffle options
                options.sort(() => Math.random() - 0.5);
                
                // Create buttons
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 text-blue-800 font-bold py-2 px-3 rounded-lg shadow transition-colors text-sm md:text-base";
                    btn.innerText = opt;
                    btn.onclick = () => {
                        if(opt === correctAns) {
                            btn.classList.replace('bg-blue-50', 'bg-green-400');
                            btn.classList.replace('text-blue-800', 'text-white');
                            this.handleSuccess();
                        } else {
                            playSound('wrong');
                            btn.classList.replace('bg-blue-50', 'bg-red-300');
                            btn.classList.replace('border-blue-200', 'border-red-400');
                            btn.classList.add('opacity-50');
                            btn.disabled = true;
                        }
                    };
                    mcqArea.appendChild(btn);
                });
            }

            showFeedback(text, isMinor = false) {
                const fb = document.getElementById('feedback-message');
                const fbText = document.getElementById('feedback-text');
                fbText.innerText = text;
                fbText.className = `text-6xl md:text-8xl font-black text-center pop-in drop-shadow-2xl ${isMinor ? 'text-red-500' : 'text-yellow-400'}`;
                
                fb.classList.remove('hidden');
                
                // Reset animation
                fbText.style.animation = 'none';
                fbText.offsetHeight; /* trigger reflow */
                fbText.style.animation = null; 

                setTimeout(() => {
                    fb.classList.add('hidden');
                }, 1500);
            }

            addCoin() {
                this.coins++;
                localStorage.setItem('eq_coins', this.coins);
                this.updateUI();
                setTimeout(() => playSound('coin'), 500);
                
                // Coin animation effect on UI
                const coinEl = document.getElementById('coin-count');
                coinEl.classList.add('scale-150', 'text-yellow-400');
                setTimeout(() => coinEl.classList.remove('scale-150', 'text-yellow-400'), 300);
            }

            updateUI() {
                document.getElementById('coin-count').innerText = this.coins;
                
                const gachaBtn = document.getElementById('btn-gacha');
                if (this.coins >= 5) {
                    gachaBtn.classList.remove('hidden', 'opacity-50', 'cursor-not-allowed');
                    gachaBtn.classList.add('animate-bounce');
                } else {
                    gachaBtn.classList.remove('animate-bounce');
                    gachaBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    if(this.coins < 5 && this.collection.length === 0) gachaBtn.classList.add('hidden');
                    else gachaBtn.classList.remove('hidden');
                }
            }

            nextRound() {
                this.round++;
                this.generateRound();
            }

            openGacha() {
                if (this.coins < 5) return;
                document.getElementById('modal-gacha').classList.remove('hidden');
                document.getElementById('gacha-result').classList.add('hidden');
                document.getElementById('btn-do-gacha').classList.remove('hidden');
                
                // check if enough coins for button state inside modal
                if(this.coins < 5) {
                     document.getElementById('btn-do-gacha').classList.add('opacity-50');
                     document.getElementById('btn-do-gacha').disabled = true;
                } else {
                     document.getElementById('btn-do-gacha').classList.remove('opacity-50');
                     document.getElementById('btn-do-gacha').disabled = false;
                }
            }

            closeGacha() {
                document.getElementById('modal-gacha').classList.add('hidden');
                document.getElementById('gacha-animation').classList.add('hidden');
            }

            playGacha() {
                if (this.coins < 5) return;
                this.coins -= 5;
                localStorage.setItem('eq_coins', this.coins);
                this.updateUI();

                playSound('gacha');
                
                const btn = document.getElementById('btn-do-gacha');
                const anim = document.getElementById('gacha-animation');
                const res = document.getElementById('gacha-result');
                
                btn.classList.add('hidden');
                anim.classList.remove('hidden');
                anim.classList.add('gacha-spin');
                res.classList.add('hidden');

                // Determine logic for rarity
                const rand = Math.random();
                let rarityFilter = "Common";
                if (rand > 0.95) rarityFilter = "Legendary";
                else if (rand > 0.8) rarityFilter = "Epic";
                else if (rand > 0.5) rarityFilter = "Rare";

                const pool = CHARACTERS.filter(c => c.rarity === rarityFilter);
                const char = pool[Math.floor(Math.random() * pool.length)];

                setTimeout(() => {
                    anim.classList.remove('gacha-spin');
                    anim.classList.add('hidden');
                    
                    document.getElementById('gacha-emoji').innerText = char.emoji;
                    document.getElementById('gacha-name').innerText = char.name;
                    
                    const rBadge = document.getElementById('gacha-rarity');
                    rBadge.innerText = char.rarity;
                    rBadge.className = `inline-block px-3 py-1 rounded-full text-sm font-bold mb-2 border ${RARITY_COLORS[char.rarity]}`;
                    
                    res.classList.remove('hidden');
                    
                    // Add to collection
                    if(!this.collection.includes(char.id)) {
                        this.collection.push(char.id);
                        localStorage.setItem('eq_collection', JSON.stringify(this.collection));
                    }

                    setTimeout(() => {
                        if(this.coins >= 5) {
                            btn.classList.remove('hidden');
                            btn.innerText = "もう1回回す！ (5🪙)";
                        } else {
                            // Show close or disable button
                            btn.classList.remove('hidden');
                            btn.classList.add('opacity-50');
                            btn.disabled = true;
                        }
                    }, 1000);

                }, 1500);
            }

            openCollection() {
                document.getElementById('modal-collection').classList.remove('hidden');
                document.getElementById('collection-count').innerText = this.collection.length;
                
                const grid = document.getElementById('collection-grid');
                grid.innerHTML = '';
                
                CHARACTERS.forEach(char => {
                    const isCollected = this.collection.includes(char.id);
                    
                    const card = document.createElement('div');
                    card.className = `flex flex-col items-center justify-center p-3 rounded-xl border-2 ${isCollected ? RARITY_COLORS[char.rarity] : 'bg-gray-50 border-dashed border-gray-200'}`;
                    
                    if (isCollected) {
                        card.innerHTML = `
                            <div class="text-4xl mb-1">${char.emoji}</div>
                            <div class="text-xs font-bold text-center line-clamp-1">${char.name}</div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="text-4xl mb-1 opacity-20 filter grayscale">❓</div>
                            <div class="text-xs font-bold text-center text-gray-400">???</div>
                        `;
                    }
                    grid.appendChild(card);
                });
            }

            closeCollection() {
                document.getElementById('modal-collection').classList.add('hidden');
            }
        }

        // Initialize App on Load
        window.onload = () => {
            window.app = new App();
        };

    </script>
</body>
</html>
